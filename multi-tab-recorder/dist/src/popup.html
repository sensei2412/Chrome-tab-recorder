<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Tab Recorder</title>
  <script type="module" crossorigin src="/src/popup.js"></script>
  <link rel="modulepreload" crossorigin href="/src/modulepreload-polyfill.js">
  <link rel="stylesheet" crossorigin href="/src/popup.css">
</head>
<body>

  <h1>Tab Recorder</h1>

  <p class="info">
    Open this popup on each tab you want to record, then click
    "Record this tab".
  </p>

  <button id="recordThis">Record this tab</button>

  <label class="option">
    <input type="checkbox" id="convert" checked>
    Save as MP4 (uncheck to save WebM)
  </label>

  <p id="message" class="message"></p>

  <div id="list"></div>

  <div class="buttons">
    <button id="pauseAll">Pause all</button>
    <button id="resumeAll">Resume all</button>
    <button id="stopAll">Stop all &amp; save</button>
  </div>


</body>
</html>
